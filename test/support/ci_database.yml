sqlite:
  adapter: sqlite3
  database: db/test.sqlite3
  pool: 20
  timeout: 5000
  # The default from Rails 8.0. Rails 7.2 starts transactions DEFERRED, so
  # concurrent writers fail with BusyException rather than waiting their turn.
  default_transaction_mode: immediate

mysql:
  adapter: mysql2
  database: runner
  pool: 5
  timeout: 5000
  username: root
  password: root

postgresql:
  adapter: postgresql
  database: runner
  pool: 5
  timeout: 5000
  username: runner
  password:
  min_messages: ERROR
